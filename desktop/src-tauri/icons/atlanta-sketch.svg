<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="78%" stop-color="#f3eee3"/>
      <stop offset="100%" stop-color="#e9e2d3"/>
    </radialGradient>
    <style>
      .p  { fill:none; stroke:#43403a; stroke-linecap:round; stroke-linejoin:round; }
      .p2 { fill:none; stroke:#6b665c; stroke-linecap:round; stroke-linejoin:round; }
      .hb { fill:none; stroke:#a39b8d; stroke-linecap:round; }
      .hw { fill:none; stroke:#57534b; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="url(#paper)"/>

  <!-- hand-drawn double frame -->
  <path class="p" stroke-width="4" opacity="0.85" d="M118,86 C420,64 640,70 906,88 C938,300 942,600 918,908 C640,936 380,934 106,910 C82,620 84,330 118,86 Z"/>
  <path class="p2" stroke-width="2" opacity="0.55" d="M138,108 C420,88 630,94 886,110 C914,310 918,590 896,888 C630,914 390,912 126,890 C104,610 106,340 138,108 Z"/>

  <!-- light construction arcs -->
  <circle class="hb" stroke-width="1.6" opacity="0.26" cx="505" cy="415" r="240"/>

  <!-- hatching: behind the skull -->
  <g class="hb" stroke-width="2.4" opacity="0.5">
    <path d="M330,330 l-48,14"/><path d="M322,360 l-52,14"/><path d="M316,390 l-54,13"/>
    <path d="M312,420 l-55,12"/><path d="M311,450 l-55,11"/><path d="M313,480 l-54,10"/>
    <path d="M318,510 l-52,9"/><path d="M327,538 l-48,8"/>
  </g>
  <!-- hatching: under the jaw and along the neck -->
  <g class="hb" stroke-width="2.2" opacity="0.45">
    <path d="M512,530 l-22,32"/><path d="M534,540 l-22,32"/><path d="M556,546 l-20,32"/>
    <path d="M474,592 l-20,34"/><path d="M496,602 l-18,34"/><path d="M518,610 l-16,34"/>
  </g>

  <!-- head and face: one continuous contour, facing right -->
  <path class="p" stroke-width="4.6" opacity="0.95" d="M434,586
    C386,566 356,512 352,444
    C348,372 374,300 432,264
    C470,240 522,236 548,252
    C574,268 588,294 594,322
    C598,340 602,354 610,366
    C618,378 620,390 611,396
    C603,401 597,401 596,407
    C595,413 603,417 607,423
    C609,428 603,432 597,435
    C595,441 603,445 605,451
    C605,457 597,459 596,465
    C597,475 590,487 576,495
    C556,507 530,513 510,511
    C496,522 488,534 484,548
    C470,562 452,576 434,586"/>

  <!-- ear, mid-skull above the jaw hinge -->
  <path class="p" stroke-width="3.6" opacity="0.85" d="M480,420 C464,410 447,417 445,435 C443,453 454,468 470,470 C482,472 488,461 486,449"/>
  <path class="p2" stroke-width="2.6" opacity="0.7" d="M468,429 C460,427 456,435 459,445"/>

  <!-- gathered hair: long strands following the skull, back of head -->
  <g class="p">
    <path stroke-width="3.8" opacity="0.85" d="M520,246 C478,266 448,308 436,360 C426,404 424,452 432,498 C438,534 450,564 468,586"/>
    <path stroke-width="3.4" opacity="0.78" d="M472,256 C438,288 418,334 412,384 C407,432 412,482 428,526"/>
    <path stroke-width="3.2" opacity="0.72" d="M428,282 C404,318 392,362 392,408 C392,452 400,494 416,532"/>
  </g>
  <!-- low bun at the nape -->
  <g class="p">
    <path stroke-width="4" opacity="0.85" d="M402,606 C362,602 338,570 344,536 C350,500 384,482 418,494 C450,506 464,542 450,574 C440,596 422,608 402,606 Z"/>
    <path stroke-width="3" opacity="0.7" d="M394,592 C368,580 358,552 368,528 C378,504 404,494 428,504"/>
    <path stroke-width="3" opacity="0.7" d="M380,568 C376,546 384,526 402,516"/>
  </g>

  <!-- eye -->
  <g class="p">
    <path stroke-width="3.4" opacity="0.9" d="M528,360 C540,350 560,348 574,356"/>
    <path stroke-width="3" opacity="0.85" d="M530,362 C542,370 560,370 572,360"/>
    <path stroke-width="3" opacity="0.8" d="M574,356 l10,-4"/>
  </g>
  <circle class="p" cx="556" cy="359" r="8.5" stroke-width="3" opacity="0.85"/>
  <circle cx="558" cy="360" r="2.6" fill="#43403a" opacity="0.9"/>
  <path class="p" stroke-width="3.6" opacity="0.85" d="M516,330 C534,320 562,318 586,324"/>

  <!-- neck and shoulder with a drapery fold -->
  <path class="p" stroke-width="4.2" opacity="0.9" d="M510,511 C504,558 496,602 482,650"/>
  <path class="p" stroke-width="4.2" opacity="0.88" d="M434,586 C448,622 462,640 482,650 C540,678 646,684 744,660 C774,652 794,646 808,640"/>
  <path class="p2" stroke-width="3.2" opacity="0.7" d="M560,668 C602,682 662,684 718,672"/>
  <!-- fibula brooch with a small leaf -->
  <circle class="p" cx="578" cy="648" r="24" stroke-width="3.6" opacity="0.85"/>
  <path class="p2" stroke-width="2.6" opacity="0.75" d="M568,656 C572,642 584,636 592,642 C586,648 578,654 568,656 Z"/>

  <!-- laurel wreath over the hair -->
  <g class="hw">
    <path stroke-width="3.4" opacity="0.85" d="M368,486 C410,398 478,326 568,292 C598,281 628,277 656,279"/>
  </g>
  <g class="hw" stroke-width="2.6" opacity="0.8">
    <path d="M414,426 C404,410 406,392 418,382 C426,396 424,414 414,426 Z"/>
    <path d="M452,382 C444,364 448,346 462,338 C468,354 464,372 452,382 Z"/>
    <path d="M496,348 C490,328 496,312 512,306 C516,322 510,340 496,348 Z"/>
    <path d="M546,324 C542,304 550,288 566,284 C568,300 562,316 546,324 Z"/>
    <path d="M598,306 C596,286 606,272 622,270 C622,286 614,300 598,306 Z"/>
    <path d="M648,296 C648,278 658,266 674,266 C672,282 664,294 648,296 Z"/>
    <path d="M434,410 C444,394 460,388 474,394 C466,408 450,416 434,410 Z"/>
    <path d="M478,372 C488,356 504,350 518,356 C510,370 494,378 478,372 Z"/>
    <path d="M526,342 C536,326 552,320 566,326 C558,340 542,348 526,342 Z"/>
    <path d="M576,318 C586,302 602,296 616,302 C608,316 592,324 576,318 Z"/>
    <path d="M626,302 C636,288 652,282 666,288 C658,302 642,310 626,302 Z"/>
  </g>

  <!-- loose pencil strokes -->
  <path class="hb" stroke-width="2" opacity="0.4" d="M702,716 C732,708 758,708 782,714"/>
  <path class="hb" stroke-width="2" opacity="0.35" d="M238,700 C262,708 286,708 308,702"/>
</svg>
