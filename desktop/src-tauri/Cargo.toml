[package]
name = "meeting-assistant-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
